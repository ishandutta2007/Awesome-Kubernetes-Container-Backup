<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0b1736" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Text & Element Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="k8sBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#326ce5" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(8px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes orbitRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -40; }
    }
    .pulsing-orb {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .stream-line {
      stroke-dasharray: 6 6;
      animation: dashStream 3s linear infinite;
    }
    .floating-dot {
      animation: floatParticle 5s ease-in-out infinite;
    }
    .rotating-helm {
      animation: orbitRotate 28s linear infinite;
      transform-origin: 1040px 210px;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Grids & Orbs -->
  <g opacity="0.12">
    <path d="M 0,70 L 1200,70 M 0,140 L 1200,140 M 0,210 L 1200,210 M 0,280 L 1200,280 M 0,350 L 1200,350" stroke="#38bdf8" stroke-width="1" />
    <path d="M 150,0 L 150,420 M 300,0 L 300,420 M 450,0 L 450,420 M 600,0 L 600,420 M 750,0 L 750,420 M 900,0 L 900,420 M 1050,0 L 1050,420" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Ambient Light Halos (Background layer only) -->
  <circle cx="200" cy="120" r="140" fill="#326ce5" class="pulsing-orb" opacity="0.3" filter="url(#glow)" />
  <circle cx="1020" cy="220" r="160" fill="#8b5cf6" class="pulsing-orb" opacity="0.25" filter="url(#glow)" style="animation-delay: -3s;" />
  <circle cx="650" cy="320" r="120" fill="#06b6d4" class="pulsing-orb" opacity="0.2" filter="url(#glow)" style="animation-delay: -1.5s;" />

  <!-- Dynamic Data Stream Vectors (Behind Foreground Text) -->
  <path d="M 120,340 C 350,310 500,370 720,330 C 880,300 980,240 1080,210" fill="none" stroke="#38bdf8" stroke-width="2" class="stream-line" opacity="0.45" />
  <path d="M 180,360 C 400,340 600,380 820,350 C 950,330 1020,270 1120,230" fill="none" stroke="#818cf8" stroke-width="1.5" class="stream-line" opacity="0.35" style="animation-direction: reverse;" />

  <!-- Animated Floating Data Packets -->
  <circle cx="340" cy="180" r="4" fill="#38bdf8" class="floating-dot" />
  <circle cx="480" cy="100" r="5" fill="#818cf8" class="floating-dot" style="animation-delay: -2s;" />
  <circle cx="820" cy="150" r="3.5" fill="#34d399" class="floating-dot" style="animation-delay: -3.5s;" />
  <circle cx="680" cy="90" r="4" fill="#67e8f9" class="floating-dot" style="animation-delay: -1s;" />

  <!-- Kubernetes Decorative Rotating Wheel Outline (Right side background) -->
  <g class="rotating-helm" opacity="0.25">
    <circle cx="1040" cy="210" r="110" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="14 8" />
    <circle cx="1040" cy="210" r="75" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="1040" cy="210" r="40" fill="none" stroke="#38bdf8" stroke-width="2" />
    <!-- Spokes -->
    <line x1="1040" y1="90" x2="1040" y2="330" stroke="#38bdf8" stroke-width="2" />
    <line x1="920" y1="210" x2="1160" y2="210" stroke="#38bdf8" stroke-width="2" />
    <line x1="955" y1="125" x2="1125" y2="295" stroke="#38bdf8" stroke-width="2" />
    <line x1="955" y1="295" x2="1125" y2="125" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- FOREGROUND CONTENT: Safe from any overlap -->

  <!-- Top Category Pill Badge -->
  <g transform="translate(80, 52)">
    <rect width="280" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <circle cx="18" cy="17" r="6" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="22" fill="#94a3b8" class="font-sans" font-size="12" font-weight="600" letter-spacing="1.2">K8S CLOUD-NATIVE ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(80, 135)">
    <text fill="url(#titleGrad)" class="font-sans" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#softShadow)">
      Kubernetes &amp; Container Backup
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(80, 178)">
    <text fill="#cbd5e1" class="font-sans" font-size="18" font-weight="400" letter-spacing="0.2">
      Curated Directory of Cloud-Native Backup, Disaster Recovery &amp; State Protection Platforms
    </text>
  </g>

  <!-- Feature Metric Badges / Cards (Foreground Bottom) -->
  <g transform="translate(80, 225)">
    <!-- Card 1: Velero & CSI -->
    <g transform="translate(0, 0)">
      <rect width="210" height="68" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="18" y="28" fill="#38bdf8" class="font-sans" font-size="13" font-weight="700">☸️ VELERO &amp; CSI</text>
      <text x="18" y="50" fill="#94a3b8" class="font-sans" font-size="12">Persistent Volume Snapshots</text>
    </g>

    <!-- Card 2: Disaster Recovery -->
    <g transform="translate(225, 0)">
      <rect width="210" height="68" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="18" y="28" fill="#818cf8" class="font-sans" font-size="13" font-weight="700">🔄 CLUSTER MIGRATION</text>
      <text x="18" y="50" fill="#94a3b8" class="font-sans" font-size="12">Multi-Cloud DR &amp; Restore</text>
    </g>

    <!-- Card 3: App-Consistent Backups -->
    <g transform="translate(450, 0)">
      <rect width="220" height="68" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="18" y="28" fill="#34d399" class="font-sans" font-size="13" font-weight="700">💾 APP CONSISTENCY</text>
      <text x="18" y="50" fill="#94a3b8" class="font-sans" font-size="12">Database &amp; Stateful Workloads</text>
    </g>

    <!-- Card 4: Enterprise & Open Source -->
    <g transform="translate(685, 0)">
      <rect width="220" height="68" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="18" y="28" fill="#f472b6" class="font-sans" font-size="13" font-weight="700">🛡️ ENTERPRISE &amp; OSS</text>
      <text x="18" y="50" fill="#94a3b8" class="font-sans" font-size="12">Kasten, Cohesity &amp; K8up</text>
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(80, 340)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#1e293b" stroke-width="1.5" />
    <text x="0" y="32" fill="#64748b" class="font-sans" font-size="13">
      🚀 100% Curated SaaS &amp; Open-Source Tools • Ranked by Valuation &amp; Community Popularity • Star History &amp; Architecture Insights
    </text>
  </g>
</svg>
